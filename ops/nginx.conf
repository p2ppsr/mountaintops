server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html /index.html;
    }
}
